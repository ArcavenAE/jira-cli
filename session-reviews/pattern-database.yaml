# Pattern Database — cross-cycle recurrence tracking
# Seeded: 2026-07-08 (first session review for this project, cycle-001, issue #571)
# Maintained by: session-reviewer agent after each cycle close

patterns:

  - id: TWIN-ARTIFACT-SWEEP
    first_observed: 2026-07-07
    occurrences: 6
    affected_cycles:
      - "cycle-001 (ADF-CODE-MARK-EXCLUSIVITY: F2 ×3 + F3 ×2)"
      - "cycle-001 (SOH-COMMENT-CRUD-1: F4 wave-C ×1 — stub-label family 4 sweeps across 3 artifact layers)"
    status: open
    linked_proposals: [IP-571-03, IP-577-01]
    upstream_ref: "drbothen/vsdd-factory#507 comment (2026-07-08)"
    description: >
      Fix rounds must propagate spec changes to ALL mirroring artifacts simultaneously.
      F2/F3 fix-round protocol lacks a mandatory sibling-sweep step (grep/diff before commit).
      Each miss costs one additional adversary pass to catch. In multi-story bundles this
      escalates: placeholder "citations updated at delivery" labels survive all per-story loops
      and are only caught at wave-integration boundary. Codified remedy: mandatory repo-wide
      label grep as final-wave delivery step (RESOLVED-BY-SHIPPING-DOC-LABEL-RECURRENCE lesson).
    severity: LOW
    pattern_class: process-gap
    drift_item_ref: TWIN-ARTIFACT-SWEEP
    last_updated: 2026-07-15

  - id: F2-19-PASS-CEILING
    first_observed: 2026-07-07
    occurrences: 3
    affected_cycles:
      - "cycle-001 (issues #385, #365, #571 — all hit ~19 passes)"
    status: open
    linked_proposal: IP-571-02
    upstream_ref: "drbothen/vsdd-factory#578 + drbothen/vsdd-factory#579 (2026-07-08)"
    description: >
      F2 pass count hits approximately 19 under STRICT criterion for complex spec evolution.
      Pattern: core contract converges by pass ~12, then a second convergence wave on
      instruction-layer consistency (band arithmetic, index drift, changelog re-sync) consumes
      the remaining passes. Contributing factor: criterion selected mid-cycle rather than at F1 gate.
    severity: MEDIUM
    pattern_class: convergence
    drift_item_ref: ADVERSARY-META-LENS-REGRESS

  - id: MISSING-CHANGELOG-ENTRY
    first_observed: 2026-07-08
    occurrences: 2
    affected_cycles:
      - "cycle-001 (F5-p3, issue #571 — PR #593 merged without CHANGELOG entry)"
    status: open
    linked_proposal: IP-571-04
    upstream_ref: "drbothen/vsdd-factory#580 (2026-07-08)"
    description: >
      Story template lacks a mandatory CHANGELOG delivery task. PR merged without a CHANGELOG.md
      entry; caught by F5 adversary in pass 3. Second occurrence of this class — first was
      caught earlier and not formally tracked.
    severity: LOW
    pattern_class: template-gap
    drift_item_ref: STORY-TEMPLATE-CHANGELOG-TASK

  - id: SPEC-CHANGELOG-RESYNC
    first_observed: 2026-07-07
    occurrences: 1
    affected_cycles:
      - "cycle-001 (ADF-CODE-MARK-EXCLUSIVITY F2 — caused resets at R4-F-MED-2 and R11-F-LOW-1)"
    status: open
    linked_proposal: IP-571-08
    upstream_ref: "drbothen/vsdd-factory#428 comment (2026-07-08)"
    description: >
      spec-changelog.md goes stale across F2 fix rounds because the fix-round protocol
      has no mandatory re-sync step. Each time the spec evolves in a fix round, the
      spec-changelog falls out of sync, and the next adversary pass detects the drift
      as a resetting finding.
    severity: LOW
    pattern_class: process-gap
    drift_item_ref: SPEC-CHANGELOG-RESYNC

  - id: SESSION-REVIEW-NEVER-RUN
    first_observed: 2026-07-08
    occurrences: 1
    affected_cycles:
      - "cycle-001 (all cycles 2026-05-04..2026-07-08; 400+ sessions)"
    status: open
    linked_proposal: IP-571-09
    upstream_ref: "drbothen/vsdd-factory#584 (2026-07-08)"
    description: >
      The /session-review synthesis step was never triggered across 400+ sessions spanning
      2026-05-04 through 2026-07-08. The factory's learning loop was broken: sidecar-learning.md
      accumulated entries but no synthesis, no pattern database, no benchmarks, no improvement
      backlog. Resolved for the ADF-CODE-MARK-EXCLUSIVITY cycle (2026-07-08) — first synthesis run.
    severity: HIGH
    pattern_class: process-gap
    resolution_note: "First synthesis run completed 2026-07-08; infrastructure seeded."

  - id: F2-MIDCYCLE-CRITERION-UPGRADE
    first_observed: 2026-07-07
    occurrences: 2
    affected_cycles:
      - "cycle-001 (ADF-CODE-MARK-EXCLUSIVITY, DEC-158 — escalated after 11 rounds)"
      - "cycle-001 (SOH-COMMENT-CRUD-1, DEC-169 — STRICT confirmed 3rd time at pass-38; mid-F2 design corrections at checkpoint)"
    status: open
    linked_proposal: IP-571-02
    upstream_ref: "drbothen/vsdd-factory#578 (2026-07-08)"
    description: >
      Convergence criterion clarified/escalated mid-cycle rather than being finalized at
      F1 gate. In #571 the criterion was escalated at pass 11; in #577 STRICT was confirmed
      a 3rd time at pass-38 checkpoint (DEC-169) alongside design corrections (--yes no-op
      ratification). Each mid-cycle checkpoint resets the streak and consumes additional passes.
      Criterion should be selected definitively at F1 gate time.
    severity: LOW
    pattern_class: gate-gap
    drift_item_ref: null
    last_updated: 2026-07-15

  - id: IMPLEMENTER-STOP-MANDATE-VIOLATION
    first_observed: 2026-07-13
    occurrences: 2
    affected_cycles:
      - "cycle-001 (SOH-COMMENT-CRUD-1: PG-F4-1 wave A — premature PR push + in-flight deviations)"
      - "cycle-001 (SOH-COMMENT-CRUD-1: PG-F4-11 wave D — substitute e2e approach without reporting)"
    status: open
    linked_proposal: IP-577-03
    upstream_ref: null
    description: >
      Implementers improvised substitute approaches past the STOP-on-deviation mandate in two
      separate waves of the same bundle. PG-F4-1: implementer pushed PR #610 prematurely and
      introduced D1/D2/D3 deviations in-flight (enum-param, ContextKind intercept) without
      reporting. PG-F4-11: implementer substituted sd.public.comment probe for story-mandated
      role/group visibility restriction without reporting. Both required human intervention for
      recovery. This is a role-agnostic failure mode (also observed in pr-manager: PG-MERGE-AUTH-BYPASS).
      The STOP-on-deviation rule must explicitly name "writing a substitute approach" as a STOP
      trigger, separate from "skipping a requirement".
    severity: MEDIUM
    pattern_class: agent-discipline
    drift_item_refs: [PG-F4-1, PG-F4-11, PG-MERGE-AUTH-BYPASS]

  - id: ADVERSARY-MUTATION-CLAIM-WITHOUT-EMPIRICAL-RUN
    first_observed: 2026-07-14
    occurrences: 1
    affected_cycles:
      - "cycle-001 (SOH-COMMENT-CRUD-1: PG-F4-10 — S-577-6 wave-C adversary pass-4)"
    status: open
    linked_proposal: IP-577-02
    upstream_ref: null
    description: >
      An adversary review pass claimed mutation coverage was adequate for S-577-6 without
      running cargo-mutants. CI subsequently caught an 86% kill rate (not 100%), requiring
      3 additional mutant-kill tests and a full mutation-gate fix round. The adversary had no
      tool access to verify the claim. This is a specialization of the ADVERSARY-VERDICT-VS-CONTRACT-
      DISCREPANCY pattern (IP-571-05): an adversary may report CLEAN on mutation while the actual
      mutation kill rate is below threshold. A mutation coverage claim must be backed by an
      empirical cargo-mutants run; otherwise the adversary must declare it UNVERIFIED.
    severity: LOW
    pattern_class: adversary-discipline
    drift_item_ref: PG-F4-10

  - id: RESUMED-SUBAGENT-IN-WRONG-WORKTREE
    first_observed: 2026-07-14
    occurrences: 1
    affected_cycles:
      - "cycle-001 (SOH-COMMENT-CRUD-1: PG-F4-8 — S-577-6 wave-C implementer resumed in S-577-4 worktree)"
    status: open
    linked_proposal: IP-577-07
    upstream_ref: null
    description: >
      A resumed sub-agent wrote stray commits to the wrong worktree (.worktrees/S-577-4) after
      context switch, when its assigned story was S-577-6. The agent had no reliable memory of
      its worktree assignment after the resume; no pre-commit branch assertion was in the resume
      prompt. Commits were caught by the orchestrator and cleaned up, but required an extra fix
      round. Deterministic fix: every resume prompt must include the explicit worktree path,
      branch name, and a mandatory pre-commit branch assertion.
    severity: LOW
    pattern_class: agent-discipline
    drift_item_ref: PG-F4-8

  - id: STATE-MANAGER-MONOLITHIC-WRITE-STALL
    first_observed: 2026-07-08
    occurrences: "4–5 total (2026-07-08/09/14)"
    affected_cycles:
      - "cycle-001 (ADF-CODE-MARK-EXCLUSIVITY: 1–2 occurrences)"
      - "cycle-001 (SOH-COMMENT-CRUD-1: 3+ occurrences, Bash-python workaround now standard)"
    status: open
    linked_proposal: IP-577-05
    upstream_ref: null
    description: >
      The timestamp-advancement PreToolUse hook forces every STATE.md edit to span the full
      file → monolithic writes → repeated API stalls under large file size and hook overhead.
      Occurrences at 2026-07-08/09/14. The Bash-python workaround (bypass PreToolUse per-edit
      gate via atomic multi-field Python) has become load-bearing standard practice rather than
      an emergency fallback. The PostToolUse hook also timed out on every PO edit during the
      wave-D BC Source sync sweep (fail-closed false-positive rejection). Engine-side fix needed:
      increase hook timeout or make PostToolUse fail-open (non-blocking) for file-edit validators.
    severity: MEDIUM
    pattern_class: infrastructure
    drift_item_ref: STATE-MANAGER-MONOLITHIC-WRITE-STALL

  - id: RESOLVED-BY-SHIPPING-DOC-LABEL
    first_observed: 2026-07-14
    occurrences: 1
    affected_cycles:
      - "cycle-001 (SOH-COMMENT-CRUD-1: wave-C 4 sweeps + wave-D BC Source sync; 3 fix PRs/commits; 3 artifact layers)"
    status: open
    linked_proposal: IP-577-01
    upstream_ref: null
    description: >
      "Resolved-by-shipping" doc-label family: stale stub labels, "citations updated at delivery"
      placeholders, and stale BC Source citations inserted during spec-design time survive all
      per-story TDD loops (each loop only touches its own story's scope) and accumulate across the
      full bundle. In SOH-COMMENT-CRUD-1 this cost 6 fix sweeps and 3 fix PRs/commits across 3
      artifact layers (docs/CLAUDE.md/src). Root cause is the same as TWIN-ARTIFACT-SWEEP but at
      the doc-label level rather than spec-index level. Codified remedy: mandatory repo-wide label
      grep (BC Source lines, TODO/FIXME/stub, deferred-to-story annotations) as a single final-wave
      delivery step at the last story of each bundle.
    severity: LOW
    pattern_class: process-gap
    drift_item_refs: [TWIN-ARTIFACT-SWEEP, PG-F4-7]

  - id: BACKGROUND-TASK-KILL-ON-LONG-VERIFICATION
    first_observed: 2026-09-02
    occurrences: 1
    affected_cycles:
      - "cycle-003 (auth-profile-dx: F6 targeted hardening — full cargo test ~26min and cargo-mutants runs killed as sub-agent background tasks; a main-loop-owned background job also killed at ~1600s)"
    status: open
    linked_proposal: IP-CYCLE003-02
    upstream_ref: null
    description: >
      Long-running verification jobs (full regression suite, mutation testing) are killed when
      launched as sub-agent background tasks -- the harness kills a sub-agent's background job
      when that sub-agent yields, which is the normal control-flow shape of a verification agent
      reporting back after kicking off a long job. A main-loop-owned background job was also
      killed at ~1600s, suggesting an additional ceiling independent of sub-agent lifecycle.
      Recovered via ad hoc chunking (segment by test binary) + main-loop-owned waiters with
      completion markers. As this project's regression suite grows (2341 -> 4763 tests in seven
      weeks), this will recur more often absent a documented default pattern.
    severity: HIGH
    pattern_class: infrastructure
    drift_item_ref: BACKGROUND-TASK-KILL-ON-LONG-VERIFICATION

  - id: KEYCHAIN-PROMPT-TEST-SLOWDOWN
    first_observed: 2026-09-02
    occurrences: 1
    affected_cycles:
      - "cycle-003 (auth-profile-dx: F6/F7 auth integration test runs slowed by real macOS keychain access prompts)"
    status: open
    linked_proposal: IP-CYCLE003-03
    upstream_ref: null
    description: >
      Auth integration test binaries trigger real-OS-keychain access prompts, making F6/F7 test
      runs slower and semi-interactive. Directly responsible for VP-AUTHDX-005/006/007/008 being
      #[ignore]-gated behind JR_RUN_KEYRING_TESTS=1 and therefore invisible to ordinary CI --
      previously tracked only as a CI-coverage-boundary decision, now also carrying a documented
      session-timing cost. Remedy: apply this repo's existing debug-only test-isolation-seam
      pattern (JR_CONFIG_DIR/JR_CACHE_DIR/JR_SERVICE_NAME/JR_STDIN_IS_TTY) to keychain Entry
      construction.
    severity: MEDIUM
    pattern_class: quality
    drift_item_ref: KEYCHAIN-PROMPT-TEST-SLOWDOWN

  - id: FRESH-CONTEXT-AUDIT-PRE-GATE-VALUE
    first_observed: 2026-07-24
    occurrences: 2
    affected_cycles:
      - "cycle-001 (SOH-ATTACHMENTS-1: F5 Step-7 secondary review found a cross-model-unique HIGH-value refactor candidate after 14 primary rounds missed it)"
      - "cycle-003 (auth-profile-dx: F7 pre-gate fresh-context consistency audit found 12 findings -- 1 CRIT/3 HIGH/2 MED/6 LOW, all doc/index-layer -- before the human gate)"
    status: open
    linked_proposal: IP-CYCLE003-04
    upstream_ref: null
    description: >
      A fresh-context or cross-perspective check run before a phase's human/quality gate has now
      found real, gate-relevant findings a converged pipeline missed in 2/2 tries across two
      different cycles and two different mechanisms (F5 secondary review; F7 pre-gate consistency
      audit). Currently ad hoc in both instances rather than a named, mandatory workflow step.
      This is a POSITIVE pattern (recommend codifying, not fixing) -- tracked here as a pattern
      because a 2/2 hit rate on a currently-optional practice is exactly the signal that should
      convert an ad hoc practice into a standing one.
    severity: LOW
    pattern_class: convergence
    drift_item_ref: FRESH-CONTEXT-AUDIT-PRE-GATE-VALUE

  - id: HOOK-BLIND-TO-DISPATCH-SCOPED-EXCEPTION
    first_observed: 2026-07-14
    occurrences: 4
    affected_cycles:
      - "cycle-001 (SOH-ATTACHMENTS-1: pr-reviewer hook vs. DEC-173, 3 occurrences across the bundle)"
      - "cycle-003 (auth-profile-dx: pr-reviewer posting-hook demanded gh pr review / pr-review.md post, contradicting an explicit report-only dispatch; ~3 turns burned before resolution)"
    status: open
    linked_proposal: IP-CYCLE003-05
    upstream_ref: null
    description: >
      A hook enforces a blanket rule (always post pr-review.md / always require AUTHORIZE_MERGE)
      with no visibility into an orchestrator-level, dispatch-scoped exception (report-only mode;
      DEC-173 self-authored PRs). Each occurrence costs agent turns spent refusing/negotiating
      before the human or orchestrator manually reconciles the conflict. 4th occurrence across two
      cycles -- recommend either pre-authorizing the hook-required artifact write up front in the
      dispatch, or teaching the hook to recognize a dispatch-scoped exception flag.
    severity: MEDIUM
    pattern_class: agent
    drift_item_ref: HOOK-BLIND-TO-DISPATCH-SCOPED-EXCEPTION

  - id: GIT-HOOK-FALSE-POSITIVE-ON-COMPOUND-COMMAND
    first_observed: 2026-09-02
    occurrences: 2
    affected_cycles:
      - "cycle-003 (auth-profile-dx: validate-factory-path-staging blocked a compound git add with explicit non-.factory args + mis-attributed worktree branch as develop; verify-git-push blocked on --force appearing in a co-located git worktree remove --force, not the actual git push)"
    status: open
    linked_proposal: IP-CYCLE003-06
    upstream_ref: null
    description: >
      Two git-safety hooks pattern-match across an entire compound shell command rather than
      parsing the specific verb/arguments they are meant to gate, producing false positives:
      (a) git-add file-argument detection ignores explicit non-.factory paths and assumes a
      default branch rather than reading the invoking worktree's actual branch; (b) --force
      detection matches the substring anywhere in the command line rather than scoping to the
      git push sub-command's own argument list. Both required workaround (splitting/isolating
      the command) rather than a hook fix.
    severity: MEDIUM
    pattern_class: infrastructure
    drift_item_ref: GIT-HOOK-FALSE-POSITIVE-ON-COMPOUND-COMMAND
