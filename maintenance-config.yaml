# Maintenance Sweep Configuration
# Created: 2026-06-22
# Format: vsdd-factory maintenance-sweep defaults

schedule: weekly

dependency_audit:
  enabled: true
  auto_pr_severity: high   # auto-PR when findings >= high

documentation_drift:
  enabled: true
  auto_pr: true            # auto-create PR for doc drift findings

pattern_consistency:
  enabled: true
  auto_pr: false           # manual review required for pattern changes

holdout:
  enabled: true
  coverage_threshold: 0.8  # 80% coverage required

perf:
  enabled: true
  regression_threshold: 0.10     # 10% regression triggers alert
  critical_regression_threshold: 0.25  # 25% regression is critical

quality_gate:
  enabled: true
  auto_merge: false        # human approval required for all merges

# external_blocker_rechecks:
# ---------------------------------------------------------------------------
# NOTE (human/orchestrator checklist, NOT auto-processed): this section is a
# documented manual pointer for the maintenance sweep / orchestrator to
# consult. The fixed sweep categories above (dependency_audit,
# documentation_drift, pattern_consistency, holdout, perf, quality_gate) do
# NOT read or act on this list automatically -- there is no scanner wired to
# it. A human or the orchestrator agent should read this list during (or
# after) a maintenance sweep and manually carry out each entry's recheck
# procedure. Added 2026-09-19 alongside the first entry below; add future
# externally-blocked standing items here as they arise (same shape: id,
# recheck summary, pointers).
external_blocker_rechecks:
  - id: S6-TEAMS-OAUTH-BLOCKED-ON-ATLASSIAN-SCOPE-PROVISIONING
    summary: >
      Whether Atlassian has opened the platform Teams API / view:team:teams
      OAuth scope to standalone Jira Cloud 3LO apps. As of 2026-09-19,
      doubly-confirmed CONFIRMED-NOT-GRANTABLE (empirical authorize
      differential test + exhaustive Developer Console API-catalog
      inspection -- 8 APIs configurable for jr's app, no Teams tile).
    recheck_summary: >
      Either is sufficient: (a) check the jr app's Developer Console
      Permissions page for a new "Teams" API tile (baseline 8 APIs, no
      Teams, as of 2026-09-19); (b) request scope view:team:teams in an
      authorize URL against jr's embedded app with an authenticated
      session -- a rendered consent screen (not the owner-facing "Something
      went wrong" error) means it is now grantable. Either signal ->
      REOPEN the standing item and consider opening the conditional S7
      teams-graphql-oauth-replatform feature cycle.
    standing_item: .factory/cycles/OPEN-STANDING-ITEMS.md (search
      S6-TEAMS-OAUTH-BLOCKED-ON-ATLASSIAN-SCOPE-PROVISIONING, "Recheck each
      maintenance sweep" subsection)
    spike_report: .factory/cycles/cycle-008/teams-graphql-spike-report.md
    fallback: >
      Teams functionality works today under API-token (Basic auth)
      profiles regardless of this recheck's outcome -- this is an
      OAuth-3LO enhancement opportunity, not a fix for something broken
      for everyone.
  - id: MAINT-BASE64-023-DEDUPE-BLOCKED-ON-UPSTREAM
    summary: >
      Whether wiremock (dev-dependency, currently 0.6.5, hard-deps
      base64 ^0.22) and/or hyper-util (transitive, currently 0.1.20,
      pulls base64 ^0.22 via its client-proxy feature) have released a
      base64-0.23-compatible version. As of 2026-09-21, neither has --
      Dependabot PRs #842 (base64 0.22.1->0.23.1) and #854 (reqwest
      0.13.4->0.13.5, which itself already moved to base64 0.23) are
      both HELD OPEN because merging either alone (or together) trips
      `cargo deny check bans`'s duplicate-version policy on base64.
      Confirmed compiles-but-blocked: this is a deny policy violation,
      not a build break or security finding.
    recheck_summary: >
      Each maintenance sweep, check the latest published versions of
      wiremock and hyper-util for a base64 0.23 (or later) dependency
      requirement. Either one moving off base64 ^0.22 is sufficient ->
      retry #842 + #854 as a SINGLE coordinated bump (both must land
      together to avoid re-triggering the duplicate-version ban in the
      interim window). No `[[bans.skip]]` suppression -- human declined
      that route explicitly; this is a wait-for-upstream item, not a
      permanent exception.
    standing_item: .factory/cycles/OPEN-STANDING-ITEMS.md (search
      MAINT-BASE64-023-DEDUPE-BLOCKED-ON-UPSTREAM)
    fallback: >
      No functional impact either way -- the dependency tree compiles
      and runs correctly with the current base64 0.22-only tree; this
      recheck exists purely to close a `cargo deny` policy gap, not to
      fix something broken.
